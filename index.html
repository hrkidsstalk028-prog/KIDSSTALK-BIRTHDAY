  "week-prev"(){ anchor=addDays(currentMonday(),-7); render(); },
  "week-next"(){ anchor=addDays(currentMonday(),7); render(); },
  "week-this"(){ anchor=mondayOf(today()); render(); },
  "week-pick"(){
    openSheet({title:"Pick a week",
      body:'<p class="tiny muted" style="margin:0 0">Choose any date and the week containing it opens.</p>'+
        '<div class="field filled"><input id="pickd" type="date" placeholder=" " value="'+ymd(currentMonday())+'"><label for="pickd">Date</label></div>',
      foot:'<button class="btn btn-quiet" data-act="close">Cancel</button>'+
           '<button class="btn btn-primary" data-act="week-set">'+ic("check")+'Show week</button>'});
  },
  "week-set"(){ const v=$("#pickd").value; if(validDob(v)){ anchor=mondayOf(parseYmd(v)); closeSheet(); render(); } },
  report(){ reportSheet(); },
  "card-prev"(){ if(cardPage>0){ cardPage--; paintCard(); } },
  "card-next"(){ if(cardPage<cardCanvases.length-1){ cardPage++; paintCard(); } },
  "card-png"(){ toast("Preparing your card…"); cardPng(); },
  "card-share"(){ cardShare(); },
  "card-pdf"(){ download(buildPdf(cardCanvases),"kidss-talk-birthdays-"+ymd(currentMonday())+".pdf"); toast("PDF downloaded","ok"); },
  "card-print"(){
    $("#printArea").innerHTML = cardCanvases.map(c=>'<img alt="Celebration card" src="'+c.toDataURL("image/png")+'">').join("");
    setTimeout(()=>window.print(),120);
  },
  "cal-prev"(){ calM--; if(calM<0){ calM=11; calY--; } calSel=null; render(); },
  "cal-next"(){ calM++; if(calM>11){ calM=0; calY++; } calSel=null; render(); },
  "cal-today"(){ const t=today(); calY=t.getFullYear(); calM=t.getMonth(); calSel=t.getDate(); render(); },
  calday(el){ const d=+el.dataset.d; calSel = calSel===d? null : d; render();
              const s=$("#page-cal .sec"); s && s.scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"nearest"}); },
  branch(el){ fBranch=el.dataset.b||""; render(); },
  sort(){ sortMode = sortMode==="next"?"name":"next"; render(); },
  "clear-q"(){ query=""; render(); const s=$("#q"); s&&s.focus(); },
  "sheet-company": companySheet,
  "sheet-lists": listsSheet,
  "sheet-appearance": appearanceSheet,
  "sheet-templates": templatesSheet,
  "sheet-install": installSheet,
  "do-install"(){ runInstallPrompt(); },
  async "copy-install-report"(){
    toast(await copyText(installReport||"") ? "Report copied ✓" : "Could not copy — read the list instead","ok");
  },
  "install-later"(){ DB.patch({installHidden:true}); refresh(); },
  "sheet-about": aboutSheet,
  "sheet-import": importSheetView,
  "sheet-export"(){
    openSheet({title:"Export the list",
      body:'<p class="tiny muted" style="margin:0 0 14px">'+DB.emp.length+' people, sorted by name, with branch, department and date of birth.</p>'+
        '<div class="btnrow"><button class="btn btn-primary" data-act="export-xlsx">'+ic("down")+'Excel</button>'+
        '<button class="btn btn-ghost" data-act="export-csv">'+ic("down")+'CSV</button></div>'});
  },
  "sheet-backup"(){
    openSheet({title:"Backup and restore",
      body:'<p class="tiny muted" style="margin:0 0 14px;line-height:1.6">A backup is one file holding every employee and all your settings. '+
        'Keep one after any big change — it is the only copy if this phone is lost.</p>'+
        '<div class="btnrow"><button class="btn btn-primary" data-act="backup">'+ic("down")+'Backup</button>'+
        '<button class="btn btn-ghost" data-act="restore">'+ic("up")+'Restore</button></div>'});
  },
  "export-csv"(){ exportCsv(); closeSheet(); },
  "export-xlsx"(){ exportXlsx(); closeSheet(); },
  backup(){ backupNow(); closeSheet(); },
  restore(){ pickFile(".json",restoreFrom); },
  "pick-import"(){ pickFile(".xlsx,.xls,.csv",handleImportFile); },
  "import-add"(){
    const good=importRows.filter(r=>!r.bad).map(r=>({name:r.name,phone:r.phone,branch:r.branch,dept:r.dept,dob:r.dob}));
    DB.addMany(good); closeSheet(); refresh(); toast(good.length+" people added","ok"); confettiBurst(50);
  },
  "import-replace"(){
    const good=importRows.filter(r=>!r.bad).map(r=>({name:r.name,phone:r.phone,branch:r.branch,dept:r.dept,dob:r.dob}));
    confirmSheet({title:"Replace everyone?", danger:true, yes:"Replace all",
      text:"The "+DB.emp.length+" people now on this device will be deleted and "+good.length+" imported in their place.",
      onYes(){ DB.replaceAll(good); refresh(); toast("List replaced","ok"); }});
  },
  "remove-demo"(){
    const n=DB.emp.filter(p=>p.demo).length;
    confirmSheet({title:"Remove demo entries?", danger:true, yes:"Remove",
      text:n+" entries marked as demo will be deleted. Real employees are untouched.",
      onYes(){ DB.replaceAll(DB.emp.filter(p=>!p.demo)); refresh(); toast("Demo entries removed","ok"); }});
  },
  "reload-master"(){
    confirmSheet({title:"Reload the master list?", danger:true, yes:"Reload",
      text:"Everything on this device is replaced with the original "+SEED_PEOPLE.length+" records. Take a backup first if you have made changes.",
      onYes(){ DB.replaceAll(SEED_PEOPLE); refresh(); toast("Master list reloaded","ok"); }});
  },
  "save-company"(){ DB.patch({company:$("#s-company").value.trim()||"KIDSS TALK", tagline:$("#s-tagline").value.trim()});
                    closeSheet(); refresh(); toast("Saved","ok"); },
  "add-list"(el){
    const k=el.dataset.k, inp=$("#add-"+k), v=inp.value.trim();
    if(!v) return;
    const list=(DB.cfg[k]||[]).slice();
    if(!list.includes(v)) list.push(v);
    list.sort((a,b)=>a.localeCompare(b));
    DB.patch({[k]:list}); listsSheet(); toast(v+" added","ok");
  },
  "del-list"(el){
    const k=el.dataset.k, v=el.dataset.v;
    const inUse = DB.emp.some(p=> (k==="branches"? p.branch : p.dept)===v);
    if(inUse) return toast(v+" is still used by an employee","bad");
    DB.patch({[k]:(DB.cfg[k]||[]).filter(x=>x!==v)}); listsSheet();
  },
  "toggle-theme"(el){
    const light = el.getAttribute("aria-pressed")!=="true";
    DB.patch({ui: light? "light":"dark"}); applyTheme();
    el.setAttribute("aria-pressed", light?"true":"false"); refresh();
  },
  "toggle-age"(el){
    const onNow = el.getAttribute("aria-pressed")!=="true";
    DB.patch({showAge:onNow}); el.setAttribute("aria-pressed", onNow?"true":"false"); refresh();
  },
  "toggle-agemsg"(el){
    const onNow = el.getAttribute("aria-pressed")!=="true";
    DB.patch({ageInMsg:onNow}); el.setAttribute("aria-pressed", onNow?"true":"false");
  },
  leap(el){ DB.patch({leap:el.dataset.v}); appearanceSheet(); refresh(); toast("Rule updated","ok"); },
  cardstyle(el){ DB.patch({theme:el.dataset.v}); appearanceSheet(); toast("Card style updated","ok"); },
  "save-templates"(){
    DB.patch({mdMsg:$("#t-md").value, empMsg:$("#t-emp").value});
    closeSheet(); toast("Templates saved","ok");
  },
  "reset-templates"(){ DB.patch({mdMsg:DEFAULT_MD, empMsg:DEFAULT_EMP}); templatesSheet(); toast("Original wording restored","ok"); }
};

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#sheet").hidden) closeSheet();
  if(e.key==="Enter" && e.target.closest("[data-act='hero-dot']")) e.target.click();
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ query=e.target.value; paintPeople();
    const c=$(".search .clr"); if(!c && query) render(), $("#q").focus(); }
});

/* ---------------- 9. BOOT ---------------- */
function applyTheme(){
  const light = DB.cfg.ui==="light";
  document.documentElement.dataset.theme = light? "light":"dark";
  const m=$('meta[name="theme-color"]'); if(m) m.content = light? "#F6F5F8":"#09090B";
  const b=$("#btnTheme"); if(b) b.innerHTML = ic(light?"moon":"sun");
}
function buildChrome(){
  $("#tabbar").innerHTML = TABS.map(t=>
    '<button data-go="'+t.id+'" aria-current="false">'+ic(t.icon)+'<span>'+t.label+'</span></button>').join("");
  $("#sideNav").innerHTML = TABS.map(t=>
    '<button data-go="'+t.id+'" aria-current="false">'+ic(t.icon)+'<span>'+t.label+'</span></button>').join("");
  $$("[data-go]").forEach(b=> on(b,"click",()=>go(b.dataset.go)));
  [ "#splashMark","#sideMark","#topMark" ].forEach(s=>{ const el=$(s); if(el) el.innerHTML=logo(); });
  $("#sheetClose").innerHTML = ic("x");
  $("#btnInstall").innerHTML = ic("down");
  $("#btnInstall").hidden = isInstalled();       /* visible whether or not Android offers a prompt */
  const st=$("#btnSettings"); if(st) st.innerHTML = ic("sliders");
  on($("#scrim"),"click",closeSheet);
  on($("#sheetClose"),"click",closeSheet);
  const g=$("#greetLine"); if(g) g.textContent = greeting()+", HR 👋";
  const s=$("#greetSub"); if(s) s.textContent = "Let's celebrate our people.";
  const f=$("#sideFoot"); if(f) f.innerHTML = "Kidss Talk Birthdays<br>Data stays on this device";
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=$("#btnInstall"); if(b && !isInstalled()) b.hidden=false;
  if(page==="home") refresh();                   /* banner switches to a one-tap install */
});
window.addEventListener("appinstalled", ()=>{
  deferredPrompt=null;
  const b=$("#btnInstall"); if(b) b.hidden=true;
  toast("Installed ✓ — open it from your home screen","ok");
  refresh();
});
async function runInstallPrompt(){
  if(!deferredPrompt) return installSheet();
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt=null;
  const b=$("#btnInstall"); if(b) b.hidden=true;
}
on($("#btnInstall"),"click", runInstallPrompt);
on($("#btnSettings"),"click", ()=>go("more"));
on($("#btnTheme"),"click", ()=>{
  DB.patch({ui: DB.cfg.ui==="light"?"dark":"light"}); applyTheme(); refresh();
});
window.addEventListener("hashchange", ()=> go(location.hash.slice(1)||"home", false));

function boot(){
  const state = DB.load();
  applyTheme();
  buildChrome();
  go(location.hash.slice(1)||"home", false);
  if(!Store.ok()) toast("This browser blocks storage — changes will not be kept","bad");
  const t=today(), born=peopleOn(t);
  setTimeout(()=>{
    const sp=$("#splash"); if(sp) sp.classList.add("gone");
    if(born.length) setTimeout(()=>confettiBurst(70),320);
  }, 620);
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", ()=>
      navigator.serviceWorker.register("sw.js")
        .catch(e=>{ window.__swError = e && e.message ? e.message : String(e); }));
  }else if(!("serviceWorker" in navigator)){
    window.__swError = "This browser has no service worker support.";
  }else{
    window.__swError = "Not registered: the page is on "+location.protocol+", not https.";
  }
  return state;
}

/* test hook — used by the build's checks, harmless in the app */
window.KT = { DB, Store, KEY, DEFAULTS, SEED_PEOPLE, boot, go, render, refresh,
  today, addDays, mondayOf, ymd, parseYmd, validDob, celebrationIn, occursOn, nextOn, daysTo,
  turningAge, ageNow, normPhone, validPhone, phoneDisplay, waNumber, peopleOn, weekDays, weekPeople, upcoming, monthMap, weekLabel, initials, firstName,
  normDob, mapRow, parseCsv, fillMsg, mdMessageText, isInstalled, runInstallChecks, empTemplates, drawCard, buildCards, buildPdf, rowsForExport,
  CARD_W, CARD_H, PER_PAGE, hueOf,
  set anchorWeek(v){ anchor=v; }, get anchorWeek(){ return anchor; } };

boot();
