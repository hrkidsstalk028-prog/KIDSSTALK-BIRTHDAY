<!DOCTYPE html>
<html lang="en-IN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kidss Talk Birthdays</title>
<meta name="description" content="Employee birthdays, weekly celebration cards and WhatsApp messages for Kidss Talk HR.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KT Birthdays">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ==========================================================================
   KIDSS TALK BIRTHDAYS — design tokens
   ========================================================================== */
:root{
  --bg:#08090D; --surface:#101119; --card:#161720; --elev:#1D1F2A; --elev2:#272936;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --ink:#F7F7FA; --ink2:#A5A7B4; --ink3:#717481;
  --gold:#E9C46A; --pink:#FF6FAE; --violet:#9B7BFF; --blue:#5CC8FF; --cyan:#5CC8FF; --peach:#FFB38A;
  --grad-a:linear-gradient(135deg,#9B7BFF 0%,#FF6FAE 100%);
  --grad-b:linear-gradient(135deg,#5CC8FF 0%,#9B7BFF 100%);
  --grad-c:linear-gradient(135deg,#FFB38A 0%,#E9C46A 100%);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --gut:16px;                       /* page margin, mobile and up */
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:20px; --r-xl:24px;
  --shadow:0 22px 44px -26px rgba(0,0,0,.95);
  --shadow-lift:0 26px 50px -24px rgba(0,0,0,1);
  --tap:44px;
  --bar:calc(66px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="light"]{
  --bg:#F6F5F8; --surface:#FFFFFF; --card:#FFFFFF; --elev:#F2F1F6; --elev2:#E8E7EE;
  --line:rgba(16,14,26,.09); --line2:rgba(16,14,26,.16);
  --ink:#16151C; --ink2:#5C5B68; --ink3:#8B8A96;
  --gold:#B8863B; --pink:#E03A7C; --violet:#6D4BE0; --blue:#1F82C7;
  --shadow:0 18px 34px -26px rgba(20,16,40,.5);
  --shadow-lift:0 22px 40px -24px rgba(20,16,40,.55);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
/* Backstop only. Every known overflow source is fixed below; this catches
   anything a future edit introduces without breaking sticky positioning. */
html{overflow-x:clip}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(90vw 60vh at 8% -8%, rgba(155,123,255,.16), transparent 62%),
    radial-gradient(70vw 50vh at 108% 4%, rgba(255,92,154,.11), transparent 60%),
    radial-gradient(80vw 60vh at 50% 112%, rgba(92,200,255,.07), transparent 62%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(90vw 60vh at 8% -8%, rgba(109,75,224,.10), transparent 62%),
    radial-gradient(70vw 50vh at 108% 4%, rgba(224,58,124,.08), transparent 60%);
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue); outline-offset:3px; border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}
::selection{background:rgba(155,123,255,.35)}

/* ---------- type scale ---------- */
.display{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.015em;
  line-height:1.06;overflow-wrap:anywhere}
.d-xl{font-size:clamp(26px,8vw,34px)}
.d-lg{font-size:clamp(24px,7vw,30px)}
.d-md{font-size:clamp(21px,6.2vw,28px)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
h1,h2,h3{margin:0;letter-spacing:-.03em}
.h-page{font-size:clamp(24px,6.6vw,28px);font-weight:800;min-width:0;line-height:1.18}
.h-sec{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.muted{color:var(--ink2)}
.tiny{font-size:13px;line-height:1.5}
.nowrap{white-space:nowrap}

/* ---------- app frame ---------- */
.app{max-width:1360px;margin:0 auto;display:block}
.side{display:none}
main{padding:0 var(--gut) calc(var(--bar) + var(--s7));max-width:100%}
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + var(--s4)) var(--gut) var(--s3);
  display:flex;align-items:center;gap:var(--s3);
  background:linear-gradient(180deg,var(--bg) 62%,rgba(9,9,11,0));
}
html[data-theme="light"] .topbar{background:linear-gradient(180deg,var(--bg) 58%,rgba(246,245,248,0))}
/* brand mark: gold spark on a dark tile, one visual language everywhere */
.brandmark{width:40px;height:40px;border-radius:var(--r-sm);flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#241C3F,#12121B);border:1px solid rgba(233,196,106,.28);
  box-shadow:0 8px 22px -12px rgba(233,196,106,.7)}
.brandmark svg{width:23px;height:23px;color:var(--gold)}
.brandtxt{flex:1;min-width:0}
.brandtxt b{display:block;font-size:14px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt span{display:block;font-size:12px;color:var(--ink3);letter-spacing:.01em;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* greeting: two compact lines, never more than a fifth of the screen */
.greeting{margin:var(--s1) 0 var(--s5)}
.greeting b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
.greeting span{display:block;font-size:14px;color:var(--ink2);margin-top:var(--s1)}
.iconbtn{
  width:var(--tap);height:var(--tap);border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);
  transition:transform .18s var(--ease),color .18s,border-color .18s,background .18s;
}
.iconbtn:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{color:var(--violet);border-color:rgba(155,123,255,.4);background:rgba(155,123,255,.12)}

/* ---------- bottom navigation ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--surface);
  background:color-mix(in srgb, var(--surface) 84%, transparent);
  backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
  border-top:1px solid var(--line);
}
.tabbar button{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:52px;padding:7px 1px 5px;border-radius:14px;color:var(--ink3);min-width:0;
  font-size:10.5px;font-weight:600;letter-spacing:0;white-space:nowrap;
  transition:color .2s var(--ease);
}
.tabbar button svg{width:22px;height:22px;transition:transform .28s var(--ease)}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.06);color:var(--violet)}
.tabbar button[aria-current="page"]::before{
  content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:3px;background:var(--grad-a);
  box-shadow:0 0 14px 1px rgba(155,123,255,.75);
}
.tabbar button::after{content:"";position:absolute;inset:0}

/* ---------- surfaces ---------- */
.card{
  background:var(--card);
  background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 82%, var(--bg)));
  border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);
}
.pad{padding:var(--s4)}
.sec{margin:var(--s6) 0 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:0 0 var(--s3)}
.sec-head .link{font-size:13px;font-weight:600;color:var(--violet);min-height:44px;
  display:inline-flex;align-items:center;padding:0 4px;flex:none}
.stack{display:grid;gap:var(--s3)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>*{min-width:0}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-width:0}
.spread>*{min-width:0}
.divider{height:1px;background:var(--line);margin:var(--s4) 0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:52px;padding:0 var(--s5);border-radius:var(--r);
  font-size:14.5px;font-weight:700;letter-spacing:-.01em;
  transition:transform .18s var(--ease),box-shadow .22s,filter .2s,background .2s,border-color .2s;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad-a);color:#fff;box-shadow:0 14px 28px -14px rgba(155,123,255,.95)}
.btn-primary:hover{filter:brightness(1.07);box-shadow:0 18px 34px -14px rgba(255,92,154,.85)}
.btn-gold{background:var(--grad-c);color:#1A1206;box-shadow:0 14px 28px -14px rgba(245,199,107,.8)}
.btn-ghost{background:var(--elev);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line2);background:var(--elev2)}
.btn-quiet{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn-quiet:hover{color:var(--ink);border-color:var(--line2)}
.btn-danger{background:rgba(255,92,154,.13);border:1px solid rgba(255,92,154,.35);color:#FF89B4}
.btn-danger:hover{background:rgba(255,92,154,.2)}
.btn-block{width:100%}
.btn-tight{padding:0 var(--s3);gap:6px}     /* paired buttons on narrow screens */
.btn-sm{min-height:44px;padding:0 var(--s4);font-size:14px;border-radius:var(--r-sm)}
.btn-sm svg{width:16px;height:16px}
.btn>span{min-width:0;overflow-wrap:anywhere}
.btnrow{display:grid;grid-template-columns:1fr;gap:var(--s3)}
.btnrow>.btn{width:100%}
@media (min-width:480px){
  .btnrow{grid-auto-flow:column;grid-auto-columns:1fr;grid-template-columns:none}
}

/* ---------- chips ---------- */
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 2px var(--s1);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;min-height:42px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;
  background:var(--elev);border:1px solid var(--line);color:var(--ink2);
  font-size:13px;font-weight:600;white-space:nowrap;transition:.18s var(--ease);
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:rgba(155,123,255,.16);border-color:rgba(155,123,255,.42);color:#D9CBFF}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--elev);color:var(--ink2);border:1px solid var(--line)}
.pill svg{width:13px;height:13px}
.pill-gold{background:rgba(245,199,107,.13);border-color:rgba(245,199,107,.34);color:var(--gold)}
.pill-pink{background:rgba(255,92,154,.13);border-color:rgba(255,92,154,.34);color:#FF89B4}
.pill-violet{background:rgba(155,123,255,.15);border-color:rgba(155,123,255,.36);color:#C7B6FF}

/* ---------- avatars ---------- */
.av{
  width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.02em;color:#fff;position:relative;
}
.av.lg{width:76px;height:76px;border-radius:26px;font-size:26px}
.av.sm{width:34px;height:34px;border-radius:12px;font-size:12.5px}
.av::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.16)}

/* ---------- hero celebration ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  padding:var(--s6) var(--s5);display:flex;flex-direction:column;align-items:center;gap:0;
  background:linear-gradient(165deg,#241640 0%,#3B1740 46%,#1A1024 100%);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 60px -30px rgba(155,60,180,.8);
  text-align:center;
}
html[data-theme="light"] .hero{background:linear-gradient(165deg,#3A2154 0%,#5A2450 48%,#2B1636 100%);color:#fff}
.hero .blob{position:absolute;border-radius:50%;filter:blur(42px);opacity:.55;pointer-events:none}
.hero .b1{width:230px;height:230px;background:#9B7BFF;top:-110px;left:-70px;animation:drift 15s ease-in-out infinite}
.hero .b2{width:210px;height:210px;background:#FF5C9A;bottom:-120px;right:-60px;animation:drift 18s ease-in-out infinite reverse}
.hero .b3{width:150px;height:150px;background:#F5C76B;top:40%;right:-80px;opacity:.3;animation:drift 22s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(16px,-18px,0)}}
.hero>*{position:relative;z-index:1}
.hero .cake{width:44px;height:44px;margin:0 0 var(--s3);color:#fff;filter:drop-shadow(0 8px 18px rgba(245,199,107,.55))}
.hero .cake svg{width:100%;height:100%}
.hero .kicker{font-size:clamp(10px,2.9vw,11px);font-weight:800;letter-spacing:.26em;
  text-transform:uppercase;color:rgba(255,255,255,.72)}
.hero .name{
  font-family:"Instrument Serif",Georgia,serif;font-size:clamp(30px,8.8vw,48px);line-height:1.08;
  margin:var(--s2) 0 var(--s2);color:#fff;letter-spacing:-.01em;overflow-wrap:anywhere;max-width:100%;
  text-shadow:0 6px 30px rgba(255,92,154,.45);
}
.hero .meta{font-size:13px;font-weight:600;color:rgba(255,255,255,.82);letter-spacing:.01em;
  line-height:1.5;overflow-wrap:anywhere}
.hero .wish{margin:var(--s4) 0 var(--s5);max-width:32ch;font-size:14px;line-height:1.6;color:rgba(255,255,255,.86)}
.hero .sprinkle{font-size:17px;letter-spacing:.4em;margin:0 0 var(--s4);padding-left:.4em}
.hero .btn-ghost{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}
.hero .btn-ghost:hover{background:rgba(255,255,255,.2)}
.hero .dots{display:flex;gap:6px;justify-content:center;margin-top:var(--s4)}
.hero .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.hero .dots i.on{background:#fff;width:18px;border-radius:3px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* quiet hero — no birthday today */
.hero-quiet{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:var(--s5) var(--s4);
  background:var(--card);
  background:linear-gradient(165deg,color-mix(in srgb,var(--card) 92%,#2A2350),var(--card));
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.hero-quiet .glowring{width:48px;height:48px;flex:none;border-radius:var(--r);display:grid;place-items:center;
  background:rgba(155,123,255,.12);border:1px solid rgba(155,123,255,.28);color:var(--violet)}
.hero-quiet .glowring svg{width:24px;height:24px}
.hero-quiet .qtop{display:flex;align-items:center;gap:var(--s3)}
.hero-quiet .qnext{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);
  padding-top:var(--s4);border-top:1px solid var(--line)}

/* ---------- week timeline (mobile-first, vertical) ---------- */
.tl{display:grid;gap:var(--s3)}
.tl-item{display:grid;grid-template-columns:52px 1fr;gap:var(--s3);align-items:start;position:relative}
.tl-when{padding-top:var(--s3);text-align:center;min-width:0}
.tl-when .dow{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink3)}
.tl-when .num{display:block;font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin-top:2px}
.tl-item.today .tl-when .dow,.tl-item.today .tl-when .num{color:var(--gold)}
.tl-card{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;text-align:left;
  padding:var(--s3) var(--s4);border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  transition:.18s var(--ease)}
.tl-card:hover{border-color:var(--line2);transform:translateY(-1px)}
.tl-card:active{transform:scale(.995)}
.tl-item.today .tl-card{background:linear-gradient(100deg,rgba(245,199,107,.13),rgba(255,92,154,.07));
  border-color:rgba(245,199,107,.38)}
.tl-card .nm{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.28;overflow-wrap:anywhere}
.tl-card .sub{font-size:13px;color:var(--ink3);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.tl-rule{height:1px;background:var(--line);margin:var(--s1) 0 var(--s1) 64px}

/* ---------- upcoming ---------- */
.urow{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;text-align:left;
  padding:var(--s3) var(--s4);border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  transition:.18s var(--ease)}
.urow:hover{border-color:var(--line2)}
.urow:active{transform:scale(.995)}
.urow .who{flex:1;min-width:0}
.urow .nm{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3;overflow-wrap:anywhere}
.urow .sub{font-size:13px;color:var(--ink3);margin-top:2px;overflow-wrap:anywhere}
.urow .end{flex:none;text-align:right;font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}

/* ---------- employee card ---------- */
.plist{display:grid;gap:var(--s3)}
.pcard{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s3);
  width:100%;max-width:100%;box-sizing:border-box;text-align:left;
  padding:var(--s3) var(--s3) var(--s3) var(--s4);
  border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  transition:.18s var(--ease);
}
.pcard:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.pcard:active{transform:scale(.995)}
.pcard .who{min-width:0;display:block;padding:0;background:none;border:0;font:inherit;color:inherit}
.pcard .nm,.pcard .sub,.pcard .bd{display:block}
.pcard .nm{font-size:18px;font-weight:700;letter-spacing:-.025em;line-height:1.26;overflow-wrap:anywhere}
.pcard .sub{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.pcard .bd{display:flex;align-items:center;gap:6px;margin-top:var(--s2);
  font-size:13px;font-weight:600;color:var(--gold)}
.pcard .bd svg{width:14px;height:14px;flex:none}
.pcard .bd.none{color:var(--ink3);font-weight:500}
.pcard .kebab{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--ink3);flex:none}
.pcard .kebab:hover{color:var(--ink);background:var(--elev)}
.pcard .kebab svg{width:18px;height:18px}
.pcard.is-today{background:linear-gradient(100deg,rgba(245,199,107,.13),rgba(255,92,154,.07));
  border-color:rgba(245,199,107,.4)}

/* ---------- install banner ---------- */
.installcard{margin:0 0 var(--s5);padding:var(--s4);border-radius:var(--r);
  background:linear-gradient(150deg,rgba(155,123,255,.16),rgba(255,111,174,.08));
  border:1px solid rgba(155,123,255,.32)}
.installcard .ic{width:38px;height:38px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;
  background:rgba(233,196,106,.14);color:var(--gold)}
.installcard .ic svg{width:19px;height:19px}

/* ---------- week navigator ---------- */
.weeknav{display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s4)}
.weeknav .lbl{flex:1;min-width:0;text-align:center}
.weeknav .lbl b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weeknav .lbl span{display:block;font-size:12px;color:var(--ink3);margin-top:1px}

/* ---------- settings / navigation rows ---------- */
.srow{display:flex;align-items:center;gap:var(--s3);width:100%;min-width:0;text-align:left;
  min-height:60px;padding:var(--s3) var(--s4);border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);transition:.18s var(--ease)}
.srow:hover{border-color:var(--line2)}
.srow:active{transform:scale(.995)}
.srow .ic{width:38px;height:38px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--elev);color:var(--violet)}
.srow .ic svg{width:18px;height:18px}
.srow .who{flex:1;min-width:0}
.srow .nm{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3;overflow-wrap:anywhere}
.srow .sub{font-size:13px;color:var(--ink3);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.srow .end{flex:none;color:var(--ink3);display:flex}
.srow .end svg{width:18px;height:18px}

/* ---------- countdown ---------- */
.count{display:grid;gap:14px}
.bar{height:6px;border-radius:99px;background:var(--elev);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad-b);transition:width .6s var(--ease)}

/* ---------- search + fields ---------- */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3)}
.search input{
  width:100%;min-height:52px;padding:0 40px 0 44px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);font-size:15px;
}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;border-color:rgba(155,123,255,.5);box-shadow:0 0 0 3px rgba(155,123,255,.13)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border-radius:10px;display:grid;place-items:center;color:var(--ink3)}
.search .clr svg{position:static;transform:none;width:16px;height:16px}

.field{position:relative;margin-top:14px}
.field>input,.field>select,.field>textarea{
  width:100%;min-height:56px;padding:22px 14px 8px;border-radius:16px;
  background:var(--elev);border:1px solid var(--line);font-size:15.5px;font-weight:600;letter-spacing:-.01em;
  appearance:none;-webkit-appearance:none;
}
.field>textarea{min-height:150px;padding-top:26px;font-weight:500;font-size:14px;line-height:1.6;resize:vertical;font-family:inherit}
.field>select{background-image:none}
.field>label{
  position:absolute;left:15px;top:17px;font-size:15px;color:var(--ink3);pointer-events:none;
  transition:.16s var(--ease);font-weight:500;
}
.field>input:focus,.field>select:focus,.field>textarea:focus{
  outline:none;border-color:rgba(155,123,255,.55);background:var(--elev2);box-shadow:0 0 0 3px rgba(155,123,255,.13)}
.field>input:focus~label,.field>input:not(:placeholder-shown)~label,
.field>textarea:focus~label,.field>textarea:not(:placeholder-shown)~label,
.field>select:focus~label,.field.filled>label{
  top:8px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--violet)}
.field .caret{position:absolute;right:14px;top:20px;width:16px;height:16px;color:var(--ink3);pointer-events:none}
.field.err>input,.field.err>select{border-color:rgba(255,92,154,.6)}
.fielderr{font-size:12px;color:#FF89B4;margin:6px 4px 0;font-weight:600}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.7);opacity:.6}
html[data-theme="light"] input[type="date"]::-webkit-calendar-picker-indicator{filter:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0}
.switch .tgl{width:50px;height:30px;border-radius:99px;background:var(--elev2);position:relative;flex:none;transition:.22s var(--ease);border:1px solid var(--line)}
.switch .tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink2);transition:.22s var(--ease)}
.switch [aria-pressed="true"].tgl{background:var(--grad-a);border-color:transparent}
.switch [aria-pressed="true"].tgl i{left:23px;background:#fff}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--ink3);text-align:center;padding:4px 0 6px}
.cell{
  aspect-ratio:1/1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--card);border:1px solid transparent;font-weight:600;color:var(--ink2);
  font-size:clamp(12.5px,3.7vw,15px);min-width:0;
  transition:.16s var(--ease);position:relative;
}
.cell.blank{background:transparent;border:0}
.cell:not(.blank):hover{border-color:var(--line2)}
.cell .bd{width:5px;height:5px;border-radius:50%;background:var(--pink);box-shadow:0 0 7px 1px rgba(255,92,154,.75)}
.cell.has{background:linear-gradient(180deg,rgba(155,123,255,.18),rgba(255,92,154,.08));color:var(--ink);font-weight:800;border-color:rgba(155,123,255,.3)}
.cell.today{border-color:var(--gold);color:var(--gold)}
.cell[aria-pressed="true"]{background:var(--grad-a);color:#fff;border-color:transparent}
.cell[aria-pressed="true"] .bd{background:#fff;box-shadow:none}

/* ---------- message card ---------- */
.msgcard{
  border-radius:var(--r-lg);padding:20px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(165deg,rgba(155,123,255,.16),rgba(255,92,154,.09));
  border:1px solid rgba(155,123,255,.3);
}
.msgcard .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.65;
  text-align:left;color:var(--ink)}
.msgcard .cakeicon{width:40px;height:40px;margin:0 auto 10px;color:var(--gold)}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(4,4,8,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity .26s var(--ease)}
.scrim.show{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--line2);
  border-radius:28px 28px 0 0;box-shadow:0 -30px 60px -30px rgba(0,0,0,.95);
  transform:translateY(102%);transition:transform .34s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--elev2);margin:10px auto 2px;flex:none}
.sheet.full{top:0;max-height:none;height:100vh;height:100dvh;border-radius:0;
  transform:translateY(100%);padding-top:env(safe-area-inset-top)}
.sheet.full.show{transform:translateY(0)}
.sheet.full .grab{display:none}
.sheet.full .shead{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);gap:var(--s2)}
.sheet.full .sbody{padding:var(--s4) var(--gut) var(--s6)}
.sheet .shead{display:flex;align-items:center;gap:12px;padding:10px 16px 12px;flex:none}
.sheet .shead h2{flex:1;min-width:0;font-size:clamp(17px,4.9vw,19px);font-weight:800;letter-spacing:-.03em;
  line-height:1.25;overflow-wrap:anywhere}
.sheet .sbody{overflow-y:auto;overflow-x:hidden;padding:2px var(--gut) var(--s5);-webkit-overflow-scrolling:touch}
.sheet .sfoot{flex:none;padding:var(--s3) var(--gut) calc(var(--s3) + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column-reverse;gap:10px}
.sheet .sfoot .btn{flex:1 1 auto;width:100%}
@media (min-width:400px){
  .sheet .sfoot{flex-direction:row}
  .sheet .sfoot .btn{width:auto}
}

/* ---------- toast ---------- */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--bar) + 14px);z-index:100;display:grid;gap:8px;
  justify-items:center;pointer-events:none;padding:0 16px}
.toast{
  display:flex;align-items:center;gap:10px;max-width:420px;
  padding:12px 16px;border-radius:15px;background:var(--elev2);border:1px solid var(--line2);
  color:var(--ink);font-size:14px;font-weight:600;box-shadow:var(--shadow-lift);
  animation:toastin .3s var(--ease);
}
.toast svg{width:17px;height:17px;flex:none;color:var(--gold)}
.toast.ok svg{color:#5BE3A0}
.toast.bad svg{color:#FF89B4}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:var(--s7) var(--s5)}
.empty .ic{width:64px;height:64px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;
  background:var(--elev);border:1px solid var(--line);color:var(--ink3)}
.empty .ic svg{width:28px;height:28px}
.empty b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.empty p{margin:6px auto 0;max-width:30ch;font-size:13.5px;color:var(--ink3);line-height:1.55}
.empty .btn{margin-top:18px}

/* ---------- report preview ---------- */
.reportwrap{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#0B0B12;box-shadow:var(--shadow)}
.reportwrap canvas{display:block;width:100%;height:auto}
.pagenav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}

/* ---------- import preview ---------- */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);max-height:46vh}
table.mini{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
table.mini th{position:sticky;top:0;background:var(--elev);text-align:left;padding:9px 10px;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:800;border-bottom:1px solid var(--line)}
table.mini td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink2)}
table.mini tr.bad td{background:rgba(255,92,154,.09);color:#FF9EC0}
table.mini tr.dup td{background:rgba(245,199,107,.08)}

/* ---------- loading screen ---------- */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);
  transition:opacity .5s var(--ease),visibility .5s}
#splash.gone{opacity:0;visibility:hidden}
#splash .in{text-align:center;animation:rise .7s var(--ease)}
#splash .mark{width:88px;height:88px;margin:0 auto 24px;border-radius:28px;
  background:linear-gradient(150deg,#241C3F,#12121B);border:1px solid rgba(233,196,106,.3);
  display:grid;place-items:center;box-shadow:0 26px 56px -22px rgba(233,196,106,.55);
  animation:pulse 2.6s ease-in-out infinite}
#splash .mark svg{width:46px;height:46px;color:var(--gold)}
#splash .nm{font-size:12px;font-weight:800;letter-spacing:.42em;text-transform:uppercase;color:var(--ink2)}
#splash .tl{font-family:"Instrument Serif",Georgia,serif;font-size:26px;margin-top:8px;color:var(--ink)}
#splash .sub{font-size:12px;color:var(--ink3);margin-top:6px;letter-spacing:.02em}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rise{animation:rise .42s var(--ease) both}
.rise-2{animation-delay:.06s}.rise-3{animation-delay:.12s}.rise-4{animation-delay:.18s}

/* ---------- desktop ---------- */
@media (min-width:1024px){
  :root{--bar:0px}
  .app{display:grid;grid-template-columns:264px 1fr;gap:26px;padding:0 26px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;padding:26px 0 20px}
  .side .brand{display:flex;align-items:center;gap:12px;padding:0 12px 22px}
  .side .brand .brandmark{width:46px;height:46px;border-radius:var(--r)}
  .side .brand .brandmark svg{width:26px;height:26px}
  .side .brand b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em}
  .side .brand span{display:block;font-size:11px;color:var(--ink3);letter-spacing:.04em}
  .side nav{display:grid;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
    color:var(--ink2);font-size:14.5px;font-weight:600;text-align:left;transition:.18s var(--ease)}
  .side nav button svg{width:20px;height:20px}
  .side nav button:hover{background:var(--card);color:var(--ink)}
  .side nav button[aria-current="page"]{background:rgba(155,123,255,.14);color:var(--ink);
    box-shadow:inset 0 0 0 1px rgba(155,123,255,.28)}
  .side nav button[aria-current="page"] svg{color:var(--violet)}
  .side .foot{margin-top:auto;padding:0 12px;font-size:11.5px;color:var(--ink3);line-height:1.5}
  .tabbar{display:none}
  main{padding:0 0 60px}
  .topbar{padding-top:26px;background:none;position:static}
  .grid2{display:grid;grid-template-columns:1.08fr .92fr;gap:var(--s6);align-items:start}
  .grid2>.sec:first-child{margin-top:0}
  .sheet.full{top:50%;height:auto;max-height:86dvh;border-radius:26px;padding-top:0}
  .sheet.full .shead{border-bottom:1px solid var(--line)}
  .sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-46%) scale(.97);
    width:min(560px,92vw);max-height:86vh;max-height:86dvh;border-radius:26px;border:1px solid var(--line2);opacity:0}
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet.wide{width:min(760px,94vw)}
  .toasts{bottom:26px}
  .hero{padding:40px 34px 32px}
  .hero .name{font-size:56px}
}
@media (min-width:1024px){ .only-mobile{display:none!important} }
@media (max-width:1023px){ .only-desk{display:none!important} }

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .hero .blob{animation:none}
}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  #printArea img{width:100%;page-break-after:always}
}
#printArea{display:none}

function uid(){ return "E"+Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,6); }

/* ---- phone numbers ----
   Stored in E.164 ("+919876543210") so WhatsApp links always work; shown
   grouped for reading. Indian numbers assumed when no country code is given. */
function normPhone(v){
  let s = String(v==null?"":v).trim();
  if(!s) return "";
  const plus = s[0]==="+";
  s = s.replace(/[^0-9]/g,"");
  if(!s) return "";
  if(plus) return "+"+s;
  if(s.length===10) return "+91"+s;
  if(s.length===11 && s[0]==="0") return "+91"+s.slice(1);
  if(s.length===12 && s.slice(0,2)==="91") return "+"+s;
  if(s.length===13 && s.slice(0,3)==="910") return "+91"+s.slice(3);
  return "+"+s;
}
function validPhone(v){
  const p = normPhone(v);
  if(!p) return false;
  if(p.slice(0,3)==="+91") return /^\+91[6-9]\d{9}$/.test(p);
  return /^\+\d{8,15}$/.test(p);                    /* other countries, kept flexible */
}
function phoneDisplay(v){
  const p = normPhone(v);
  if(!p) return "";
  if(p.slice(0,3)==="+91" && p.length===13) return "+91 "+p.slice(3,8)+" "+p.slice(8);
  return p;
}
const waNumber = v => normPhone(v).replace(/^\+/,"");

function normalise(p){
  return {
    id: p.id || uid(),
    name: String(p.name||"").replace(/\s+/g," ").trim(),
    phone: normPhone(p.phone),
    branch: String(p.branch||"").trim(),
    dept: String(p.dept||"").trim(),
    dob: String(p.dob||"").trim(),
    log: Array.isArray(p.log)? p.log.slice(-20) : [],
    demo: !!p.demo
  };
}

const DB = {
  data:{ v:1, employees:[], settings:Object.assign({},DEFAULTS) },
  get emp(){ return this.data.employees; },
  get cfg(){ return this.data.settings; },
  saved:true, timer:null,

  load(){
    const raw = Store.load(KEY);
    if(raw){
      try{
        const d = JSON.parse(raw);
        if(d && Array.isArray(d.employees)){
          this.data = { v:1, employees:d.employees.map(normalise),
                        settings:Object.assign({},DEFAULTS,d.settings||{}) };
          this.ensureLists();
          return "restored";
        }
      }catch(e){}
    }
    this.data = { v:1, employees:SEED_PEOPLE.map(normalise), settings:Object.assign({},DEFAULTS) };
    this.ensureLists(); this.saveNow();
    return "seeded";
  },
  ensureLists(){
    const c=this.cfg, from = k => this.emp.map(p=>p[k]).filter(Boolean);
    const uniq = a => Array.from(new Set(a)).sort((x,y)=>x.localeCompare(y));
    c.branches = uniq((c.branches||[]).concat(from("branch")));
    c.depts    = uniq((c.depts||[]).concat(from("dept")));
  },
  saveNow(){ this.saved = Store.save(KEY, JSON.stringify(this.data)); return this.saved; },
  save(){ clearTimeout(this.timer); this.timer = setTimeout(()=>this.saveNow(), 120); },

  add(p){ const e=normalise(Object.assign({id:uid()},p)); this.emp.push(e); this.ensureLists(); this.save(); return e; },
  logAction(id,what){
    const e=this.emp.find(x=>x.id===id); if(!e) return;
    e.log = (e.log||[]).concat([{d:new Date().toISOString(), k:what}]).slice(-20);
    this.save();
  },
  update(id,p){ const e=this.emp.find(x=>x.id===id); if(!e) return null;
                Object.assign(e, normalise(Object.assign({},e,p,{id:e.id}))); this.ensureLists(); this.save(); return e; },
  remove(id){ this.data.employees = this.emp.filter(x=>x.id!==id); this.save(); },
  replaceAll(list){ this.data.employees = list.map(normalise); this.ensureLists(); this.save(); },
  addMany(list){ list.forEach(p=>this.emp.push(normalise(Object.assign({id:uid()},p)))); this.ensureLists(); this.save(); },
  patch(o){ Object.assign(this.cfg,o); this.save(); }
};

/* ---------------- 3. BIRTHDAY ENGINE ---------------- */
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const pad2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
function parseYmd(s){ const p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ const n = window.__NOW ? new Date(window.__NOW) : new Date();
                  return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
                      x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const isLeap = y => y%4===0 && (y%100!==0 || y%400===0);
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dayLong = d => d.getDate()+" "+MONS[d.getMonth()];
const dayShort = d => d.getDate()+" "+MON3[d.getMonth()];
const firstName = n => String(n).trim().split(/\s+/)[0] || String(n);
function initials(n){
  const w = String(n).trim().split(/\s+/);
  return ((w[0]||"")[0]||"?").toUpperCase() + ((w[1]||"")[0]||"").toUpperCase();
}
function validDob(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||"")) return false;
  const d = parseYmd(s);
  return !isNaN(d) && d.getFullYear()===+s.slice(0,4) && d.getMonth()===+s.slice(5,7)-1 && d.getDate()===+s.slice(8,10);
}
const hasDob = p => validDob(p.dob);

/* Which calendar day does this person's birthday land on, in year `y`? */
function celebrationIn(p,y){
  if(!hasDob(p)) return null;
  const m = +p.dob.slice(5,7)-1, d = +p.dob.slice(8,10);
  if(m===1 && d===29 && !isLeap(y)){
    const rule = DB.cfg.leap;
    if(rule==="mar01") return new Date(y,2,1);
    if(rule==="exact") return null;
    return new Date(y,1,28);
  }
  return new Date(y,m,d);
}
function occursOn(p,date){
  const c = celebrationIn(p, date.getFullYear());
  return !!c && sameDay(c,date);
}
/* Next celebration on or after `from` */
function nextOn(p,from){
  const base = from || today();
  for(let i=0;i<5;i++){
    const c = celebrationIn(p, base.getFullYear()+i);
    if(c && c.getTime() >= base.getTime()) return c;
  }
  return null;
}
function daysTo(p,from){
  const base = from||today(), n = nextOn(p,base);
  return n ? Math.round((n-base)/86400000) : null;
}
/* Age completed as of today — recalculated every time, never stored. */
function ageNow(p,on){
  if(!hasDob(p)) return null;
  const b = parseYmd(p.dob), d = on || today();
  const y = +p.dob.slice(0,4);
  if(y < 1930) return null;
  let a = d.getFullYear() - b.getFullYear();
  /* follow the celebrated day, so a 29 Feb birthday ages on the day the app
     actually celebrates it rather than a day or two later */
  const c = celebrationIn(p, d.getFullYear());
  const had = c ? d.getTime() >= c.getTime()
                : (d.getMonth() > b.getMonth() ||
                  (d.getMonth() === b.getMonth() && d.getDate() >= b.getDate()));
  if(!had) a -= 1;
  return (a>=0 && a<100) ? a : null;
}
function turningAge(p,onDate){
  if(!hasDob(p)) return null;
  const y = +p.dob.slice(0,4);
  if(y < 1930) return null;
  const age = (onDate||nextOn(p)||today()).getFullYear() - y;
  return (age>0 && age<100) ? age : null;
}
function peopleOn(date,list){
  return (list||DB.emp).filter(p=>occursOn(p,date))
    .sort((a,b)=>a.name.localeCompare(b.name));
}
function weekDays(monday){
  const out=[];
  for(let i=0;i<7;i++){ const d=addDays(monday,i); out.push({date:d, people:peopleOn(d)}); }
  return out;
}
function weekPeople(monday){
  return weekDays(monday).flatMap(d=> d.people.map(p=>({p, date:d.date})));
}
function upcoming(n,from){
  const base = from||today();
  return DB.emp.filter(hasDob)
    .map(p=>({p, date:nextOn(p,base), days:daysTo(p,base)}))
    .filter(x=>x.date)
    .sort((a,b)=> a.days-b.days || a.p.name.localeCompare(b.p.name))
    .slice(0, n||10);
}
function monthMap(y,m){
  const map={};
  DB.emp.forEach(p=>{
    const c = celebrationIn(p,y);
    if(c && c.getMonth()===m) (map[c.getDate()] = map[c.getDate()]||[]).push(p);
  });
  Object.values(map).forEach(a=>a.sort((x,z)=>x.name.localeCompare(z.name)));
  return map;
}
function weekLabel(monday){
  const a=monday, b=addDays(monday,6);
  const am = a.getMonth()===b.getMonth() ? "" : " "+MON3[a.getMonth()];
  return a.getDate()+am+" – "+b.getDate()+" "+MON3[b.getMonth()]+" "+b.getFullYear();
}
/* Stable colour per person, from the name */
function hueOf(name){
  let h=0; const s=String(name);
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360;
  return h;
}
function avatarStyle(name){
  const h=hueOf(name);
  return "background:linear-gradient(135deg,hsl("+h+" 72% 58%),hsl("+((h+42)%360)+" 76% 52%))";
}
function avatar(p,cls){
  return '<div class="av '+(cls||"")+'" style="'+avatarStyle(p.name)+'" aria-hidden="true">'+esc(initials(p.name))+'</div>';
}
function subLine(p){
  return [p.dept,p.branch].filter(Boolean).join(" • ") || "No department recorded";
}
function daysWord(n){
  if(n===0) return "Today";
  if(n===1) return "Tomorrow";
  return "In "+n+" days";
}

/* confetti — short, soft, motion-safe */
const CONF = {c:null, x:null, parts:[], raf:0};
function confettiBurst(count){
  if(reduceMotion()) return;
  const c = CONF.c || (CONF.c = $("#confetti"));
  if(!c || !c.getContext) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  c.width = innerWidth*dpr; c.height = innerHeight*dpr;
  c.style.width=innerWidth+"px"; c.style.height=innerHeight+"px";
  const x = CONF.x = c.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#F5C76B","#FF5C9A","#9B7BFF","#5CC8FF","#FF9E7D","#FFFFFF"];
  for(let i=0;i<(count||60);i++){
    CONF.parts.push({
      x: innerWidth*(.15+Math.random()*.7), y: innerHeight*.22+Math.random()*40,
      vx:(Math.random()-.5)*3.4, vy:-2-Math.random()*4.2,
      r:3+Math.random()*4, a:1, rot:Math.random()*6.3, vr:(Math.random()-.5)*.24,
      col:cols[(Math.random()*cols.length)|0]
    });
  }
  if(!CONF.raf) CONF.raf = requestAnimationFrame(confettiStep);
}
function confettiStep(){
  const x=CONF.x, c=CONF.c;
  x.clearRect(0,0,c.width,c.height);
  CONF.parts = CONF.parts.filter(p=>p.a>0.02 && p.y<innerHeight+40);
  CONF.parts.forEach(p=>{
    p.vy += 0.12; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.a -= 0.006;
    x.save(); x.globalAlpha=Math.max(0,p.a); x.translate(p.x,p.y); x.rotate(p.rot);
    x.fillStyle=p.col; x.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2); x.restore();
  });
  if(CONF.parts.length) CONF.raf = requestAnimationFrame(confettiStep);
  else { x.clearRect(0,0,c.width,c.height); CONF.raf=0; }
}

/* routing */
function go(p,push){
  p = ALIAS[p] || p;
  if(!TABS.some(t=>t.id===p)) p="home";

  page=p;
  TABS.forEach(t=> $("#page-"+t.id).hidden = (t.id!==p));
  $$("#tabbar button,#sideNav button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.go===p ? "page" : "false"));
  render();
  if(push!==false && location.hash.slice(1)!==p) location.hash = p;
  window.scrollTo(0, scrollMem[p]||0);
}

/* ---- PEOPLE ---- */
function filteredPeople(){
  const q = query.trim().toLowerCase();
  let list = DB.emp.filter(p=>{
    if(fBranch && p.branch!==fBranch) return false;
    if(!q) return true;
    const hay = (p.name+" "+p.branch+" "+p.dept+" "+p.phone+" "+phoneDisplay(p.phone)).toLowerCase();
    return hay.includes(q) || (q.replace(/\D/g,"") && p.phone.includes(q.replace(/\D/g,"")));
  });
  if(sortMode==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  else list.sort((a,b)=>{
    const x=daysTo(a), y=daysTo(b);
    if(x==null && y==null) return a.name.localeCompare(b.name);
    if(x==null) return 1; if(y==null) return -1;
    return x-y || a.name.localeCompare(b.name);
  });
  return list;
}

/* ---- CALENDAR ---- */
function viewCal(){
  const t=today();
  if(!calY){ calY=t.getFullYear(); calM=t.getMonth(); }
  const map = monthMap(calY,calM);
  const first = new Date(calY,calM,1);
  const lead = (first.getDay()+6)%7;                 /* Monday-first */
  const len = new Date(calY,calM+1,0).getDate();
  const count = Object.values(map).reduce((n,a)=>n+a.length,0);

  let cells="";
  for(let i=0;i<lead;i++) cells += '<div class="cell blank"></div>';
  for(let d=1;d<=len;d++){
    const has = !!map[d], isT = (calY===t.getFullYear()&&calM===t.getMonth()&&d===t.getDate());
    const sel = calSel===d;
    cells += '<button class="cell'+(has?" has":"")+(isT?" today":"")+'" data-act="calday" data-d="'+d+'" '+
      'aria-pressed="'+(sel?"true":"false")+'" aria-label="'+d+' '+MONS[calM]+(has?", "+map[d].length+" birthdays":"")+'">'+
      '<span>'+d+'</span>'+(has?'<span class="bd"></span>':'')+'</button>';
  }

  let out = '<div class="spread" style="margin:var(--s1) 0 var(--s4)">'+
      '<h1 class="h-page">Calendar</h1>'+
      '<div class="row" style="gap:8px">'+
        '<button class="iconbtn" data-act="cal-prev" aria-label="Previous month">'+ic("left")+'</button>'+
        '<button class="iconbtn" data-act="cal-next" aria-label="Next month">'+ic("right")+'</button>'+
      '</div></div>';

  out += '<div class="card pad">'+
      '<div class="spread" style="margin-bottom:var(--s4)">'+
        '<div style="min-width:0"><div class="display d-md">'+MONS[calM]+' '+calY+'</div>'+
        '<div class="tiny muted" style="margin-top:2px">'+(count? count+(count===1?" birthday":" birthdays") : "No birthdays")+'</div></div>'+
        '<button class="chip" data-act="cal-today">Today</button>'+
      '</div>'+
      '<div class="cal">'+["M","T","W","T","F","S","S"].map(d=>'<div class="dow">'+d+'</div>').join("")+cells+'</div>'+
    '</div>';

  const sel = calSel && map[calSel];
  out += '<section class="sec">'+
    (sel
      ? '<div class="sec-head"><h2 class="h-sec">'+calSel+' '+MONS[calM]+'</h2>'+
        '<span class="tiny muted">'+sel.length+(sel.length===1?" person":" people")+'</span></div>'+
        '<div class="plist">'+sel.map(p=>personCard(p,{date:new Date(calY,calM,calSel)})).join("")+'</div>'
      : '<div class="card pad tiny muted" style="text-align:center">'+
        (count? "Tap a highlighted date to see who is celebrating." : "No celebrations in this month.")+'</div>')+
  '</section>';
  return out;
}

  "wish-whatsapp":"Birthday wish — WhatsApp opened",

function logWhen(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  const t=today(), day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((t-day)/86400000);
  const time=pad2(d.getHours())+":"+pad2(d.getMinutes());
  return (diff===0? "Today" : diff===1? "Yesterday" : dayShort(day)+" "+day.getFullYear())+" • "+time;
}

function saveForm(id){
  const name=$("#f-name").value.trim(), branch=$("#f-branch").value.trim(),
        dept=$("#f-dept").value.trim(), dob=$("#f-dob").value.trim(),
        phone=$("#f-phone").value.trim();
  const err=$("#f-err");
  const fail = m => { err.textContent=m; err.hidden=false; $("#f-name").parentNode.classList.toggle("err", m.indexOf("name")>-1); };
  if(!name) return fail("Please enter the employee name.");
  if(dob && !validDob(dob)) return fail("That date of birth is not a valid date.");
  if(dob && parseYmd(dob) > today()) return fail("The date of birth cannot be in the future.");
  if(phone && !validPhone(phone))
    return fail("That mobile number does not look right. An Indian number has 10 digits starting 6, 7, 8 or 9.");
  const dupe = DB.emp.find(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase());
  if(dupe && !id && !saveForm.forced){
    saveForm.forced = true;
    return fail(name+" is already on the list. Press add again to keep both.");
  }
  saveForm.forced = false;
  if(id){ DB.update(id,{name,phone,branch,dept,dob}); toast("Employee updated ✓","ok"); }
  else  { DB.add({name,phone,branch,dept,dob}); toast(firstName(name)+" added ✓","ok"); confettiBurst(40); }
  closeSheet(); refresh();
}

/* ---- messages ---- */
function fillMsg(tpl,p,extra){
  const d = (p && nextOn(p)) || today();
  const turning = p ? turningAge(p, d) : null;
  const useAge = DB.cfg.ageInMsg && turning != null;
  return String(tpl)
    .replace(/{EmployeeName}/g,p?p.name:"")
    .replace(/{Age}/g, turning!=null? String(turning) : "")
    .replace(/{Branch}/g,p?(p.branch||"Kidss Talk"):"")
    .replace(/{Department}/g,p?(p.dept||""):"")
    .replace(/{ageth}/g, useAge? ordinal(turning)+" " : "")
    .replace(/{age}/g, turning!=null? String(turning) : "")
    .replace(/{name}/g,p?p.name:"")
    .replace(/{first}/g,p?firstName(p.name):"")
    .replace(/{branch}/g,p?(p.branch||"Kidss Talk"):"")
    .replace(/{dept}/g,p?(p.dept||""):"")
    .replace(/{date}/g,dayLong(d))
    .replace(/{count}/g,(extra&&extra.count)||"")
    .replace(/{plural}/g,(extra&&extra.count)===1?" is":"s are")
    .replace(/{company}/g,DB.cfg.company);
}
function empTemplates(){
  return String(DB.cfg.empMsg||DEFAULT_EMP).split(/\n-{3,}\n/).map(s=>s.trim()).filter(Boolean);
}

function openWhatsApp(number,text){
  const base = number ? "https://wa.me/"+number : "https://wa.me/";
  const url = base + (text ? "?text="+encodeURIComponent(text) : "");
  const w = window.open(url,"_blank","noopener");
  if(w) toast("WhatsApp opened — press send there");
  else { copyText(text); toast("Message copied — paste it into WhatsApp","ok"); }
}
function telDial(number){
  const a = document.createElement("a");
  a.href = "tel:"+number; a.style.display="none";
  document.body.appendChild(a); a.click(); a.remove();
}
function mdMessageText(){
  const mon = currentMonday(), all = weekPeople(mon);
  const withPhones = !!DB.cfg.mdPhones;
  const lines = all.map(x=>{
    const age = DB.cfg.showAge? ageNow(x.p, x.date) : null;
    const bits = [dayShort(x.date)];
    if(age!=null) bits.push("Age "+age);
    if(x.p.branch) bits.push(x.p.branch);
    if(withPhones && validPhone(x.p.phone)) bits.push(phoneDisplay(x.p.phone));
    return "🎂 "+x.p.name+" — "+bits.join(" • ");
  }).join("\n");
  return fillMsg(DB.cfg.mdMsg||DEFAULT_MD, null, {count:all.length}) +
         (all.length? "\n\n"+lines : "");
}

async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  try{
    const a=document.createElement("textarea"); a.value=t;
    a.style.cssText="position:fixed;top:-1000px"; document.body.appendChild(a);
    a.select(); const ok=document.execCommand("copy"); a.remove(); return ok;
  }catch(e){ return false; }
}
async function shareText(text){
  if(navigator.share){
    try{ await navigator.share({text:text}); toast("Shared","ok"); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  const w = window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener");
  if(w) toast("WhatsApp opened — press send there");
  else { await copyText(text); toast("Message copied — paste it into WhatsApp","ok"); }
}

/* ---- installation: status + real diagnostics ----
   Chrome refuses to install for several different reasons and reports none of
   them to the page. So every requirement is checked here and shown plainly. */
function isInstalled(){
  try{
    if(navigator.standalone === true) return true;                       /* iOS */
    if(window.matchMedia){
      if(matchMedia("(display-mode: standalone)").matches) return true;
      if(matchMedia("(display-mode: window-controls-overlay)").matches) return true;
      if(matchMedia("(display-mode: fullscreen)").matches) return true;
    }
    if(document.referrer.indexOf("android-app://")===0) return true;
  }catch(e){}
  return false;
}
function checkRow(state,label,detail){
  const col = state==="ok"?"#5BE3A0":state==="bad"?"#FF89B4":"var(--ink3)";

    '<span style="width:18px;height:18px;flex:none;color:'+col+';margin-top:1px">'+ic(mark)+'</span>'+
    '<span style="flex:1;min-width:0"><b style="font-size:14px;display:block;overflow-wrap:anywhere">'+esc(label)+'</b>'+
    '<span class="tiny muted" style="display:block;margin-top:2px;line-height:1.5;overflow-wrap:anywhere">'+esc(detail)+'</span></span></div>';

let installReport = "";
async function runInstallChecks(){
  const out=[]; let blocking=0;
  const add=(st,l,d)=>{ out.push(checkRow(st,l,d)); if(st==="bad") blocking++; };

  /* 1. secure context — judge by the address, not only isSecureContext */
  const local = location.hostname==="localhost" || location.hostname==="127.0.0.1";
  const secure = location.protocol==="https:" || local;
  add(secure?"ok":"bad","Served over HTTPS",
    secure? location.protocol+"//"+location.host
          : location.protocol==="file:"
            ? "This is a file opened from the phone's storage. It can never be installed — upload the files and open the https:// address."
            : "Opened over "+location.protocol.replace(":","")+". Android only installs from an https:// address such as GitHub Pages.");

  /* 2. manifest */
  let mf=null;
  const link=document.querySelector('link[rel="manifest"]');
  if(!link) add("bad","Manifest linked","No manifest link in the page.");
  else{
    try{
      const res=await fetch(link.href,{cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      mf=await res.json();
      add("ok","Manifest loads",link.href.split("/").pop()+" — "+res.status+" "+(res.headers.get("content-type")||""));
    }catch(e){
      add("bad","Manifest loads","Could not read "+link.href+" ("+e.message+"). The file is probably not uploaded next to index.html.");
    }
  }
  if(mf){
    const need=["name","short_name","start_url","display","icons"];
    const missing=need.filter(k=>!mf[k]);
    add(missing.length?"bad":"ok","Manifest fields",
      missing.length? "Missing: "+missing.join(", ") : mf.name+" • "+mf.short_name+" • display: "+mf.display);
    add(mf.display==="standalone"?"ok":"bad","Opens without browser bars",
      "display is "+mf.display+(mf.display==="standalone"?"":" — must be standalone"));
  }

  /* 3. icons actually reachable at the right size */
  if(mf && mf.icons){
    const results=await Promise.all(mf.icons.map(i=>new Promise(res=>{
      const img=new Image();
      img.onload=()=>res({src:i.src,ok:true,w:img.naturalWidth,h:img.naturalHeight,want:i.sizes});
      img.onerror=()=>res({src:i.src,ok:false});
      img.src=new URL(i.src, link? link.href : location.href).href;
    })));
    const broken=results.filter(r=>!r.ok);
    const wrong=results.filter(r=>r.ok && r.want && r.want!==r.w+"x"+r.h);
    const big=results.some(r=>r.ok && r.w>=512), small=results.some(r=>r.ok && r.w>=192);
    if(broken.length) add("bad","App icons load",broken.map(b=>b.src).join(", ")+" could not be fetched.");
    else if(wrong.length) add("bad","App icons load",wrong.map(r=>r.src+" is "+r.w+"×"+r.h+", manifest says "+r.want).join("; "));
    else if(!(big&&small)) add("bad","App icons load","A 192×192 and a 512×512 icon are both required.");
    else add("ok","App icons load",results.map(r=>r.w+"×"+r.h).join(", "));
  }

  /* 3b. is this a real browser, or a page opened inside another app? */
  const ua0 = navigator.userAgent;
  const inApp = /; wv\)/.test(ua0) || /\bFBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat|Twitter/i.test(ua0);
  const isChrome = /Chrome\//.test(ua0) && !/EdgA|OPR|SamsungBrowser/.test(ua0);
  add(inApp? "bad" : "ok", "Opened in a real browser",
    inApp? "This page is running inside another app's built-in browser (opened from WhatsApp, Instagram or similar). "+
           "Those cannot install anything. Tap the ⋮ menu and choose “Open in Chrome”, or paste the address into Chrome."
         : (isChrome? "Chrome" : /Firefox/i.test(ua0)? "Firefox"
            : /SamsungBrowser/i.test(ua0)? "Samsung Internet"
            : /Safari/i.test(ua0)? "Safari" : "Browser") + " — installation is supported here.");

  /* 3c. address the page was opened from */
  const host = location.hostname;
  const badHost = /raw\.githubusercontent|githubusercontent\.com/.test(host);
  add(badHost? "bad":"ok","Correct web address",
    badHost? "raw.githubusercontent.com serves files as plain text and can never be installed. "+
             "Use your GitHub Pages address instead (yourname.github.io/…)."
           : location.origin + location.pathname);

  /* 4. service worker */
  if(!("serviceWorker" in navigator)) add("bad","Service worker","This browser has no service worker support.");
  else{
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      if(!reg) add("bad","Service worker registered", window.__swError
        ? "Failed — "+window.__swError
        : "Not registered. If this is your first visit, reload the page once.");
      else{
        const w=reg.active?"active":reg.installing?"installing":reg.waiting?"waiting":"unknown";
        add(reg.active?"ok":"info","Service worker registered","scope "+reg.scope+" — "+w);
        add(navigator.serviceWorker.controller?"ok":"info","Page under its control",
          navigator.serviceWorker.controller? "Offline use is working."
            : "Not yet. Close the tab and open it again — this is normal on a first visit.");
      }
    }catch(e){ add("bad","Service worker registered",e.message); }
  }

  /* 5. what the browser is offering */
  const ua=navigator.userAgent;
  const installed=isInstalled();
  if(installed) add("ok","Already installed","You are running the installed app right now.");
  else if(deferredPrompt) add("ok","Install offer received","Android has offered installation — use the button below.");
  else if(/Firefox/i.test(ua)) add("info","Install offer received","Firefox does not offer an automatic prompt. Menu → Install.");
  else if(/CriOS|iPhone|iPad/i.test(ua)) add("info","Install offer received","On iPhone use Share → Add to Home Screen. iOS never shows a prompt.");
  else add("info","Install offer received",
    "No offer yet. Chrome withholds it when the app is already installed, or for a few seconds after the first load.");

  const plain = out.map(h => h.replace(/<[^>]+>/g," ")
    .replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/\s+/g," ").trim()).join("\n");
  installReport = "Kidss Talk Birthdays — install check\n" +
    new Date().toISOString().slice(0,16).replace("T"," ") + "\n" +
    location.href + "\n" + navigator.userAgent + "\n\n" + plain;
  return {html:out.join('<div class="divider" style="margin:0"></div>'), blocking:blocking, installed:installed};
}

/* Turn whatever a spreadsheet hands over into YYYY-MM-DD, without letting the
   timezone move the day. Nothing here builds a date from a bare string unless
   the format is unambiguous. */
function normDob(v){
  if(v==null || v==="") return "";

  /* A real Date, e.g. from an .xlsx cell. Spreadsheet libraries hand these over
     either at UTC midnight or at local midnight depending on the file, and
     reading the wrong one shifts the day. Take whichever is midnight. */
  const isDate = v && typeof v.getTime === "function" && !isNaN(v.getTime());
  if(isDate){
    if(v.getUTCHours()===0 && v.getUTCMinutes()===0 && v.getUTCSeconds()===0)
      return v.getUTCFullYear()+"-"+pad2(v.getUTCMonth()+1)+"-"+pad2(v.getUTCDate());
    return ymd(v);          /* otherwise the local calendar day, never shifted */
  }

  let s = String(v).trim();
  if(!s) return "";

  /* Excel serial number, e.g. 34831 — days since 30 December 1899 */
  if(/^\d{4,5}(\.\d+)?$/.test(s)){
    const n = Math.round(parseFloat(s));
    if(n>=1 && n<=60000){
      const base = new Date(1899,11,30);
      base.setDate(base.getDate()+n);
      return ymd(base);
    }
  }

  /* drop any trailing time — "12-05-1995 00:00", "1995-05-12T00:00:00.000Z" */
  s = s.replace(/[T ]\d{1,2}:\d{2}(:\d{2})?(\.\d+)?\s*(Z|[AaPp]\.?[Mm]\.?)?$/,"").trim();

  let m;
  if((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/)))          /* 1995-05-12 */
    return m[1]+"-"+pad2(+m[2])+"-"+pad2(+m[3]);
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){    /* 12/05/1995 */
    let y=+m[3]; if(y<100) y += y>30? 1900 : 2000;
    return y+"-"+pad2(+m[2])+"-"+pad2(+m[1]);                          /* day first */
  }
  if((m = s.match(/^(\d{1,2})[ \-]([A-Za-z]{3,})[ \-,]*(\d{2,4})$/))){    /* 12-May-1995 */
    const mi = MONS.findIndex(x=>x.toLowerCase().startsWith(m[2].toLowerCase().slice(0,3)));
    let y=+m[3]; if(y<100) y += y>30? 1900 : 2000;
    if(mi>=0) return y+"-"+pad2(mi+1)+"-"+pad2(+m[1]);
  }
  if((m = s.match(/^([A-Za-z]{3,})[ \-]+(\d{1,2})[ \-,]+(\d{2,4})$/))){   /* May 12, 1995 */
    const mi = MONS.findIndex(x=>x.toLowerCase().startsWith(m[1].toLowerCase().slice(0,3)));
    let y=+m[3]; if(y<100) y += y>30? 1900 : 2000;
    if(mi>=0) return y+"-"+pad2(mi+1)+"-"+pad2(+m[2]);
  }
  return s;                       /* not understood — the preview will flag it */
}
const HEAD_MAP = {
  name:["name","employee name","employee","staff name","full name"],
  branch:["branch","store","location","showroom","unit"],
  dept:["dept","department","section","category"],
  dob:["dob","date of birth","birth date","birthday","d.o.b","dateofbirth"],
  phone:["phone","mobile","mobile number","mobile no","phone number","contact","contact number","whatsapp","cell"]
};
function mapRow(obj){
  const out={name:"",branch:"",dept:"",dob:"",phone:""};
  Object.keys(obj).forEach(k=>{
    const key=String(k).toLowerCase().replace(/[^a-z. ]/g,"").trim();
    Object.keys(HEAD_MAP).forEach(f=>{ if(HEAD_MAP[f].includes(key) && !out[f]) out[f]=obj[k]; });
  });
  out.name=String(out.name||"").trim(); out.branch=String(out.branch||"").trim();
  out.dept=String(out.dept||"").trim();
  const rawDob = out.dob;
  out.dob=normDob(out.dob);
  out.phone=out.phone===""? "" : normPhone(out.phone);
  out.raw = rawDob==null? "" :
    (rawDob && typeof rawDob.getTime === "function" ? "(date cell)" : String(rawDob).trim());
  return out;
}
function parseCsv(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const head=(rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(c=>String(c).trim())).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=r[i]); return o;
  });
}

/* ---------------- 7. CELEBRATION CARD ---------------- */
const CARD_W = 1080, CARD_H = 1350, PER_PAGE = 5;
const SANS = '"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif';
const SERIF = '"Instrument Serif",Georgia,"Times New Roman",serif';

function rrect(x,cx,cy,w,h,r){
  x.beginPath();
  x.moveTo(cx+r,cy); x.arcTo(cx+w,cy,cx+w,cy+h,r); x.arcTo(cx+w,cy+h,cx,cy+h,r);
  x.arcTo(cx,cy+h,cx,cy,r); x.arcTo(cx,cy,cx+w,cy,r); x.closePath();
}
function tt(x,text,cx,cy,sp,align){
  const s=String(text), w=s.split("").reduce((n,c)=>n+x.measureText(c).width+sp,0)-sp;
  let px = align==="center" ? cx-w/2 : align==="right" ? cx-w : cx;
  for(const c of s){ x.fillText(c,px,cy); px += x.measureText(c).width+sp; }
  return w;
}
function fitFont(x,text,maxW,size,min,weight,family){
  let s=size;
  do{ x.font=(weight?weight+" ":"")+s+"px "+(family||SANS); if(x.measureText(text).width<=maxW) break; s-=2; }
  while(s>min);
  return s;
}
function glow(x,cx,cy,r,colour,alpha){
  const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,"rgba("+colour+","+alpha+")"); g.addColorStop(1,"rgba("+colour+",0)");
  x.fillStyle=g; x.fillRect(cx-r,cy-r,r*2,r*2);
}
/* Cake and sparkle drawn with plain canvas commands — no Path2D, so it renders
   identically in every browser and can be checked in the build. */
function drawSpark(x,cx,cy,r,colour,alpha){
  x.save(); x.globalAlpha=alpha==null?1:alpha; x.fillStyle=colour; x.beginPath();
  x.moveTo(cx,cy-r);
  x.quadraticCurveTo(cx+r*.2,cy-r*.2,cx+r,cy);
  x.quadraticCurveTo(cx+r*.2,cy+r*.2,cx,cy+r);
  x.quadraticCurveTo(cx-r*.2,cy+r*.2,cx-r,cy);
  x.quadraticCurveTo(cx-r*.2,cy-r*.2,cx,cy-r);
  x.fill(); x.restore();
}
/* Draws one 1080×1350 celebration card. Pure canvas — no DOM. */
function drawCard(x,opt){
  const cfg = opt.cfg||DB.cfg, rows = opt.rows||[], pad = 78;
  const light = cfg.theme === "light";
  const ink = light? "#17151F" : "#F6F5FA", ink2 = light? "#5D5A6B" : "#A6A3B5";
  const gold = light? "#A9741F" : "#E9C46A";

  x.fillStyle = light? "#F7F5FA" : "#0B0B12";
  x.fillRect(0,0,CARD_W,CARD_H);
  if(!light){
    glow(x,180,-60,760,"155,123,255",.34);
    glow(x,980,240,620,"255,92,154",.20);
    glow(x,560,1420,760,"92,200,255",.13);
  }else{
    glow(x,180,-60,700,"155,123,255",.20);
    glow(x,980,220,560,"255,92,154",.14);
  }
  /* confetti specks */
  const spec=["#E9C46A","#FF6FAE","#9B7BFF","#5CC8FF"];
  let seed = 7;
  const rnd = ()=> (seed = (seed*1103515245+12345) % 2147483648) / 2147483648;
  for(let i=0;i<46;i++){
    const px=rnd()*CARD_W, py=rnd()*CARD_H, s=4+rnd()*7;
    x.save(); x.globalAlpha=.2+rnd()*.3; x.translate(px,py); x.rotate(rnd()*6.28);
    x.fillStyle=spec[(rnd()*spec.length)|0]; x.fillRect(-s/2,-s/4,s,s/2); x.restore();
  }

  /* header */
  x.textBaseline="alphabetic";
  x.fillStyle=gold; x.font='800 22px '+SANS;
  tt(x,String(cfg.company||"KIDSS TALK").toUpperCase(),pad,pad+42,6.5,"left");
  x.fillStyle=ink2; x.font='600 19px '+SANS;
  tt(x,String(cfg.tagline||"").toUpperCase(),pad,pad+76,4.2,"left");

  /* the same gold spark used as the app's brand mark */
  drawSpark(x,CARD_W-pad-38,pad+48,40,gold);
  drawSpark(x,CARD_W-pad-38,pad+48,16,light? "#F3E2BC":"#FFE8B2");
  drawSpark(x,CARD_W-pad-2,pad+18,15,gold,.95);
  drawSpark(x,CARD_W-pad-96,pad+26,11,"#FF6FAE",.9);
  drawSpark(x,CARD_W-pad-88,pad+86,9,"#9B7BFF",.85);

  x.fillStyle=ink; x.font='128px '+SERIF;
  x.fillText("Birthday",pad,pad+238);
  x.fillStyle="#FF6FAE"; x.font='128px '+SERIF;
  x.fillText("Celebrations",pad,pad+352);

  /* week chip */
  const label = opt.label||"";
  x.font='700 25px '+SANS;
  const cw = label.split("").reduce((n,c)=>n+x.measureText(c).width+2.6,0)+56;
  rrect(x,pad,pad+400,cw,60,30);
  x.fillStyle = light? "rgba(155,123,255,.14)" : "rgba(255,255,255,.07)"; x.fill();
  x.strokeStyle = light? "rgba(155,123,255,.4)" : "rgba(255,255,255,.16)"; x.lineWidth=1.6; x.stroke();
  x.fillStyle = light? "#5B3FCF" : "#D9CBFF";
  tt(x,label,pad+28,pad+439,2.6,"left");

  const n = opt.total==null? rows.length : opt.total;
  x.fillStyle=ink2; x.font='600 25px '+SANS;
  x.fillText(n+(n===1?" celebration":" celebrations")+" this week", pad+cw+26, pad+439);

  /* rows */
  let y = pad + 520;
  const rowH = Math.min(148, (CARD_H-260-y)/Math.max(1,rows.length));
  rows.forEach(r=>{
    const p=r.p, cy=y+rowH/2-8;
    /* avatar */
    const h=hueOf(p.name), R=48;
    const g=x.createLinearGradient(pad,cy-R,pad+R*2,cy+R);
    g.addColorStop(0,"hsl("+h+" 72% 58%)"); g.addColorStop(1,"hsl("+((h+42)%360)+" 76% 52%)");
    x.beginPath(); x.arc(pad+R,cy,R,0,6.2832); x.fillStyle=g; x.fill();
    x.strokeStyle="rgba(255,255,255,.22)"; x.lineWidth=2; x.stroke();
    x.fillStyle="#fff"; x.font='800 34px '+SANS; x.textAlign="center";
    x.fillText(initials(p.name),pad+R,cy+12); x.textAlign="left";

    /* name + meta */
    const tx=pad+R*2+30, dateW=210, maxW=CARD_W-pad-tx-dateW;
    x.fillStyle=ink; fitFont(x,p.name,maxW,50,26,"",SERIF);
    x.fillText(p.name,tx,cy-2);
    x.fillStyle=ink2; x.font='600 22px '+SANS;
    const a = (cfg.showAge!==false) ? ageNow(p, r.date) : null;
    const meta=[(a!=null? "Age "+a : ""),p.dept,p.branch].filter(Boolean).join("  •  ")||"Kidss Talk";
    fitFont(x,meta,maxW,22,15,"600");
    x.fillText(meta,tx,cy+32);

    /* date */
    x.font='800 21px '+SANS; x.fillStyle=gold;
    tt(x,DOW3[r.date.getDay()].toUpperCase()+"  "+r.date.getDate()+" "+MON3[r.date.getMonth()].toUpperCase(),
       CARD_W-pad,cy+8,2.4,"right");

    y += rowH;
    if(y < CARD_H-260){
      x.strokeStyle = light? "rgba(20,16,40,.09)" : "rgba(255,255,255,.08)";
      x.lineWidth=1; x.beginPath(); x.moveTo(pad,y-6); x.lineTo(CARD_W-pad,y-6); x.stroke();
    }
  });

  /* note */
  const nh=118, ny=CARD_H-pad-nh-58;
  rrect(x,pad,ny,CARD_W-pad*2,nh,26);
  x.fillStyle = light? "rgba(155,123,255,.10)" : "rgba(255,255,255,.05)"; x.fill();
  x.strokeStyle = light? "rgba(155,123,255,.3)" : "rgba(255,255,255,.12)"; x.lineWidth=1.5; x.stroke();
  drawSpark(x,pad+52,ny+nh/2,19,gold);
  drawSpark(x,pad+72,ny+nh/2+21,8,"#FF6FAE",.85);
  x.fillStyle=ink; x.font='800 21px '+SANS;
  tt(x,"A NOTE FOR THE TEAM",pad+96,ny+50,3.2,"left");
  x.fillStyle=ink2; x.font='500 22px '+SANS;
  x.fillText("Do take a moment to wish them on their special day.",pad+96,ny+86);

  /* footer */
  x.fillStyle = light? "#8B879B" : "#6E6B7D"; x.font='700 18px '+SANS;
  tt(x,"HUMAN RESOURCES",pad,CARD_H-52,3.4,"left");
  x.fillStyle = opt.pages>1 ? gold : (light? "#8B879B":"#6E6B7D");
  tt(x, opt.pages>1 ? "PAGE "+opt.page+" OF "+opt.pages : String(cfg.company||"").toUpperCase(),
     CARD_W-pad, CARD_H-52, 3.4, "right");
}

/* PDF: JPEG pages wrapped by hand, so nothing has to load from the internet */
function b64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function buildPdf(canvases){
  const enc=new TextEncoder(); const chunks=[]; let len=0;
  const push = u8 => { chunks.push(u8); len+=u8.length; return len; };
  const pushStr = s => push(enc.encode(s));
  const offsets=[0]; const objCount=2+canvases.length*3;
  pushStr("%PDF-1.4\n");
  const W=595.28, H=841.89;
  const imgs=canvases.map(c=>b64ToBytes(c.toDataURL("image/jpeg",0.94).split(",")[1]));
  const obj=(id,body,stream)=>{
    offsets[id]=len; pushStr(id+" 0 obj\n"+body+"\n");
    if(stream){ pushStr("stream\n"); push(stream); pushStr("\nendstream\n"); }
    pushStr("endobj\n");
  };
  const pageIds=canvases.map((_,i)=>3+i*3);
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+pageIds.map(i=>i+" 0 R").join(" ")+"] /Count "+pageIds.length+" >>");
  canvases.forEach((c,i)=>{
    const pid=3+i*3, cid=pid+1, iid=pid+2;
    const iw=W-56, ih=iw*(c.height/c.width), top=(H-ih)/2;
    const content=enc.encode("q "+iw.toFixed(2)+" 0 0 "+ih.toFixed(2)+" 28 "+top.toFixed(2)+" cm /I0 Do Q");
    obj(pid,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W.toFixed(2)+" "+H.toFixed(2)+
        "] /Resources << /XObject << /I0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>");
    obj(cid,"<< /Length "+content.length+" >>",content);
    obj(iid,"<< /Type /XObject /Subtype /Image /Width "+c.width+" /Height "+c.height+
        " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+imgs[i].length+" >>",imgs[i]);
  });
  const xref=len;
  let s="xref\n0 "+(objCount+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<=objCount;i++) s+=String(offsets[i]||0).padStart(10,"0")+" 00000 n \n";
  pushStr(s);
  pushStr("trailer\n<< /Size "+(objCount+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(chunks,{type:"application/pdf"});
}
